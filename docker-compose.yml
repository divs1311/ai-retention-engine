services:
  api:
    build: .
    image: retention-engine:latest
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]
    volumes: [artifacts:/app/artifacts]

  dashboard:
    image: retention-engine:latest
    depends_on: [api]
    command: ["streamlit", "run", "app/Home.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]
    env_file: [{ path: .env, required: false }]
    volumes: [artifacts:/app/artifacts]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  artifacts:
