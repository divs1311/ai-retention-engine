name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev]" pandas-stubs
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[api,dev]"
      - name: Run tests
        env:
          RE_LOG_LEVEL: WARNING
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Test coverage: {rate:.1f}%")
          EOF

  min-deps:
    name: Tests (lowest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.10 && uv pip install --resolution lowest-direct -e ".[api,dev]"
      - run: RE_LOG_LEVEL=WARNING uv run --no-sync pytest

  pipeline:
    name: End-to-end pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all]"
      - run: retention-engine run --provider template
      - run: retention-engine train
      - uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: artifacts/churn_model_card.json

  docker:
    name: Docker build & health check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retention-engine:ci .
      - name: Start API and wait for /health
        run: |
          docker run -d --name re -p 8000:8000 retention-engine:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs re; exit 1
