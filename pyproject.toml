[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retention-engine"
version = "1.0.0"
description = "Quick-commerce retention intelligence: cohort analytics, ML churn prediction and LLM-generated lifecycle CRM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Divyanshu" }]
keywords = ["retention", "churn", "cohort-analysis", "crm", "llm", "quick-commerce"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dashboard = ["streamlit>=1.36", "plotly>=5.20"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = ["retention-engine[llm,api,dashboard]"]

[project.scripts]
retention-engine = "retention_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/retention_engine"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY", "RUF"]
# E501: line width is owned by `ruff format`; long user-facing strings are left intact.
ignore = ["E501", "PD010", "PD011", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"tests/**" = ["PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end tests that run the full pipeline"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["retention_engine"]
omit = ["*/api/*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
